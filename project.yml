name: DistanceBackfill
options:
  bundleIdPrefix: im.googol
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: zh-Hans

targets:
  DistanceBackfill:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.googol.DistanceBackfill
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: "U652BY6X67"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "里程补全"
        CFBundleLocalizations:
          - zh-Hans
          - en
        NSHealthShareUsageDescription: "需要读取你的训练记录，用于检测缺失的独立距离数据"
        NSHealthUpdateUsageDescription: "需要写入训练对应的距离数据，补全健康 App 的距离统计"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Generated/DistanceBackfill.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    scheme:
      testTargets:
        - DistanceBackfillTests
      commandLineArguments:
        "-SEED_DEBUG_DATA": false

  DistanceBackfillTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/DistanceBackfillTests
    settings:
      base:
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: im.googol.DistanceBackfill.Tests
        DEVELOPMENT_TEAM: "U652BY6X67"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: DistanceBackfill
